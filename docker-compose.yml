services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: dataset_quality
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchangeme"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dataset_quality
      DB_USER: root
      DB_PASSWORD: changeme
      JWT_SECRET: change-this-docker-secret
      JWT_EXPIRES_IN: 7d
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: 10
      PYTHON_BIN: python3
      ANALYSIS_TIMEOUT_MS: 60000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: AdminPass123
      ADMIN_NAME: Admin
      CORS_ORIGIN: "*"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
